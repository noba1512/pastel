services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Código no host. Entrypoint fica em /usr/local/bin, fora deste mount.
    volumes:
      - .:/app
      - ./data:/app/data
      - staticfiles:/app/staticfiles
    environment:
      SQLITE_PATH: /app/data/db.sqlite3

volumes:
  staticfiles:
