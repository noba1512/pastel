{% if is_paginated %}
<nav class="pager mt-5 flex items-center justify-between gap-3" aria-label="Paginação">
  {% if page_obj.has_previous %}
  <a class="min-h-11 px-4 py-2 bg-white/10" href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value|urlencode }}&amp;{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">Anterior</a>
  {% else %}
  <span class="min-h-11 px-4 py-2 text-paper/40">Anterior</span>
  {% endif %}
  <p class="font-mono text-sm">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</p>
  {% if page_obj.has_next %}
  <a class="min-h-11 px-4 py-2 bg-white/10" href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value|urlencode }}&amp;{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">Próxima</a>
  {% else %}
  <span class="min-h-11 px-4 py-2 text-paper/40">Próxima</span>
  {% endif %}
</nav>
{% endif %}
